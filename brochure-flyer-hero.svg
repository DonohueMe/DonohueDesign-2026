  <rect width="1440" height="900" fill="url(#bff-base-sky)"/>
  <rect width="1440" height="900" fill="url(#bff-spot-blue)"/>
  <rect width="1440" height="900" fill="url(#bff-spot-magenta)"/>
  <rect width="1440" height="900" fill="url(#bff-spot-orange)"/>

  <g filter="url(#bff-aurora-blur)">
    <ellipse cx="280" cy="420" rx="340" ry="260" fill="#2080ff" opacity="0.62"/>
    <ellipse cx="720" cy="400" rx="380" ry="240" fill="#e82888" opacity="0.52"/>
    <ellipse cx="1180" cy="390" rx="360" ry="280" fill="#ff9020" opacity="0.68"/>
    <ellipse cx="980" cy="430" rx="280" ry="200" fill="#ffd050" opacity="0.42"/>
  </g>

  <g filter="url(#bff-wave-blur)">
    <path d="M0,360 C220,180 480,520 720,280 C960,40 1200,420 1440,220 L1440,900 L0,900 Z" fill="url(#bff-wave-blue)" opacity="0.58"/>
    <path d="M0,420 C180,260 460,560 700,340 C940,120 1180,480 1440,300 L1440,900 L0,900 Z" fill="url(#bff-wave-blue-bright)" opacity="0.72"/>
    <path d="M0,470 C260,300 540,600 820,380 C1100,160 1320,520 1440,360 L1440,900 L0,900 Z" fill="url(#bff-wave-magenta)" opacity="0.78"/>
    <path d="M0,520 C240,380 520,640 800,420 C1080,200 1300,560 1440,420 L1440,900 L0,900 Z" fill="#e02888" opacity="0.62"/>
    <path d="M0,570 C280,430 580,680 880,460 C1180,240 1360,580 1440,480 L1440,900 L0,900 Z" fill="url(#bff-wave-orange)" opacity="0.82"/>
    <path d="M0,620 C320,480 620,720 920,500 C1220,280 1380,620 1440,540 L1440,900 L0,900 Z" fill="url(#bff-wave-orange-bright)" opacity="0.88"/>
  </g>

  <rect y="700" width="1440" height="200" fill="url(#bff-floor-glow)" opacity="0.85"/>

  <!-- left stack -->
  <g transform="translate(0, 30)">
    <!-- back -->
    <g transform="matrix(1,0,0.08,0.9,8,425)" opacity="0.48">
      <rect x="0" y="0" width="128" height="240" rx="12" fill="url(#bff-glass-fill)" stroke="url(#bff-glass-edge-neutral)" stroke-width="1.2"/>
      <rect x="10" y="14" width="72" height="5" rx="2.5" fill="#ffffff" opacity="0.22"/>
      <rect x="10" y="28" width="88" height="4" rx="2" fill="#ffffff" opacity="0.16"/>
      <rect x="10" y="40" width="64" height="4" rx="2" fill="#ffffff" opacity="0.12"/>
