      <circle cx="20" cy="78" r="2.5" fill="#ffffff" opacity="0.32"/>
      <rect x="28" y="76" width="86" height="4" rx="2" fill="#ffffff" opacity="0.18"/>
      <rect x="16" y="96" width="78" height="78" rx="5" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="24" y="104" width="36" height="36" rx="18" fill="#2080ff" fill-opacity="0.32"/>
      <rect x="102" y="96" width="68" height="78" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
      <rect x="110" y="118" width="10" height="36" rx="2" fill="url(#bff-bar-a)"/>
      <rect x="126" y="108" width="10" height="46" rx="2" fill="url(#bff-bar-b)"/>
      <rect x="142" y="128" width="10" height="26" rx="2" fill="url(#bff-bar-a)"/>
      <rect x="16" y="188" width="154" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="16" y="188" width="98" height="5" rx="2.5" fill="#2080ff" fill-opacity="0.45"/>
      <text x="178" y="308" text-anchor="end" fill="#ffffff" fill-opacity="0.26" font-family="system-ui,sans-serif" font-size="10" font-weight="500">2</text>
    </g>
  </g>

