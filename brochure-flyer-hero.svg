      <rect x="30" y="46" width="78" height="4" rx="2" fill="#ffffff" opacity="0.26"/>
      <circle cx="22" cy="60" r="2.5" fill="#ffffff" opacity="0.3"/>
      <rect x="30" y="58" width="68" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
      <rect x="18" y="78" width="108" height="72" rx="5" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
