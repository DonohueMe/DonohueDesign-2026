<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="bff-wave-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0038a8"/>
      <stop offset="100%" stop-color="#0078ff"/>
    </linearGradient>
    <linearGradient id="bff-wave-blue-bright" x1="0%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#0050dd"/>
      <stop offset="100%" stop-color="#20a0ff"/>
    </linearGradient>
    <linearGradient id="bff-wave-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#901858"/>
      <stop offset="50%" stop-color="#d02090"/>
      <stop offset="100%" stop-color="#ff2890"/>
    </linearGradient>
    <linearGradient id="bff-wave-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c84808"/>
      <stop offset="100%" stop-color="#ff9018"/>
    </linearGradient>
    <linearGradient id="bff-wave-orange-bright" x1="55%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7810"/>
      <stop offset="100%" stop-color="#ffd050"/>
    </linearGradient>
    <radialGradient id="bff-spot-blue" cx="22%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#40a0ff" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#0848e8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0038a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bff-spot-orange" cx="84%" cy="44%" r="40%">
      <stop offset="0%" stop-color="#ffb040" stop-opacity="0.98"/>
      <stop offset="42%" stop-color="#ff7810" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#ff6010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bff-spot-magenta" cx="52%" cy="46%" r="34%">
      <stop offset="0%" stop-color="#ff4898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e82888" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bff-glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="bff-glass-edge-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90c8ff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="bff-glass-edge-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bff-glass-edge-orange" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb860" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bff-panel-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bff-bar-a" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2080ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#60b0ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bff-bar-b" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e82888" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff60a8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bff-base-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2858c8"/>
      <stop offset="38%" stop-color="#c02888"/>
      <stop offset="72%" stop-color="#ff2890"/>
      <stop offset="100%" stop-color="#ff9020"/>
    </linearGradient>
    <linearGradient id="bff-floor-glow" x1="0" y1="720" x2="1440" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2080ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff2890" stop-opacity="0.12"/>
      <stop offset="72%" stop-color="#ff9018" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd050" stop-opacity="0"/>
    </linearGradient>
    <filter id="bff-aurora-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="bff-wave-blur" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="bff-panel-glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="0" stdDeviation="12" flood-color="#4090ff" flood-opacity="0.35"/>
    </filter>
    <filter id="bff-panel-glow-orange" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="4" dy="0" stdDeviation="14" flood-color="#ff9020" flood-opacity="0.32"/>
    </filter>
