      <rect x="0" y="0" width="198" height="330" rx="14" fill="url(#bff-glass-fill)" stroke="url(#bff-glass-edge-blue)" stroke-width="1.6"/>
      <rect x="8" y="8" width="182" height="314" rx="12" fill="url(#bff-panel-screen)"/>
      <circle cx="20" cy="20" r="2.5" fill="#ff6058" opacity="0.7"/>
      <circle cx="29" cy="20" r="2.5" fill="#ffbd2e" opacity="0.7"/>
      <circle cx="38" cy="20" r="2.5" fill="#28c840" opacity="0.7"/>
      <rect x="16" y="34" width="118" height="7" rx="3.5" fill="#ffffff" opacity="0.52"/>
      <circle cx="20" cy="54" r="2.5" fill="#ffffff" opacity="0.32"/>
