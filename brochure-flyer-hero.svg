      <rect x="0" y="0" width="158" height="280" rx="13" fill="url(#bff-glass-fill)" stroke="url(#bff-glass-edge-neutral)" stroke-width="1.3"/>
      <rect x="10" y="10" width="138" height="260" rx="9" fill="url(#bff-panel-screen)"/>
      <rect x="18" y="28" width="96" height="6" rx="3" fill="#ffffff" opacity="0.42"/>
      <circle cx="22" cy="48" r="2.5" fill="#ffffff" opacity="0.3"/>
      <rect x="30" y="46" width="78" height="4" rx="2" fill="#ffffff" opacity="0.26"/>
      <circle cx="22" cy="60" r="2.5" fill="#ffffff" opacity="0.3"/>
      <rect x="30" y="58" width="68" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
      <rect x="18" y="78" width="108" height="72" rx="5" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    </g>
