    <g transform="matrix(1,0,-0.05,0.955,1067,334)" filter="url(#bff-panel-glow-orange)">
      <rect x="0" y="0" width="198" height="330" rx="14" fill="url(#bff-glass-fill)" stroke="url(#bff-glass-edge-orange)" stroke-width="1.6"/>
      <rect x="8" y="8" width="182" height="314" rx="12" fill="url(#bff-panel-screen)"/>
      <circle cx="20" cy="20" r="2.5" fill="#ff6058" opacity="0.7"/>
      <circle cx="29" cy="20" r="2.5" fill="#ffbd2e" opacity="0.7"/>
      <circle cx="38" cy="20" r="2.5" fill="#28c840" opacity="0.7"/>
      <rect x="64" y="34" width="118" height="7" rx="3.5" fill="#ffffff" opacity="0.52"/>
      <rect x="16" y="96" width="78" height="78" rx="5" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="24" y="104" width="36" height="36" rx="18" fill="#ff9020" fill-opacity="0.35"/>
      <rect x="102" y="52" width="68" height="5" rx="2.5" fill="#ffffff" opacity="0.3"/>
      <rect x="102" y="66" width="56" height="5" rx="2.5" fill="#ffffff" opacity="0.24"/>
      <rect x="102" y="80" width="62" height="5" rx="2.5" fill="#ffffff" opacity="0.18"/>
      <rect x="16" y="188" width="154" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="72" y="188" width="98" height="5" rx="2.5" fill="#ff9020" fill-opacity="0.45"/>
      <text x="178" y="308" text-anchor="end" fill="#ffffff" fill-opacity="0.26" font-family="system-ui,sans-serif" font-size="10" font-weight="500">4</text>
