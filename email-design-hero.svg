  <rect width="1440" height="900" fill="url(#ed-base-sky)"/>
  <rect width="1440" height="900" fill="url(#ed-spot-blue)"/>
  <rect width="1440" height="900" fill="url(#ed-spot-magenta)"/>
  <rect width="1440" height="900" fill="url(#ed-spot-orange)"/>

  <g filter="url(#ed-aurora-blur)">
    <ellipse cx="280" cy="420" rx="340" ry="260" fill="#2080ff" opacity="0.62"/>
    <ellipse cx="720" cy="400" rx="380" ry="240" fill="#e82888" opacity="0.52"/>
    <ellipse cx="1180" cy="390" rx="360" ry="280" fill="#ff9020" opacity="0.68"/>
    <ellipse cx="980" cy="430" rx="280" ry="200" fill="#ffd050" opacity="0.42"/>
  </g>

  <g filter="url(#ed-wave-blur)">
    <path d="M0,360 C220,180 480,520 720,280 C960,40 1200,420 1440,220 L1440,900 L0,900 Z" fill="url(#ed-wave-blue)" opacity="0.58"/>
    <path d="M0,420 C180,260 460,560 700,340 C940,120 1180,480 1440,300 L1440,900 L0,900 Z" fill="url(#ed-wave-blue-bright)" opacity="0.72"/>
    <path d="M0,470 C260,300 540,600 820,380 C1100,160 1320,520 1440,360 L1440,900 L0,900 Z" fill="url(#ed-wave-magenta)" opacity="0.78"/>
    <path d="M0,520 C240,380 520,640 800,420 C1080,200 1300,560 1440,420 L1440,900 L0,900 Z" fill="#e02888" opacity="0.62"/>
    <path d="M0,570 C280,430 580,680 880,460 C1180,240 1360,580 1440,480 L1440,900 L0,900 Z" fill="url(#ed-wave-orange)" opacity="0.82"/>
    <path d="M0,620 C320,480 620,720 920,500 C1220,280 1380,620 1440,540 L1440,900 L0,900 Z" fill="url(#ed-wave-orange-bright)" opacity="0.88"/>
  </g>

  <rect y="700" width="1440" height="200" fill="url(#ed-floor-glow)" opacity="0.85"/>

  <!-- left: exciting promotional offer email -->
  <g transform="translate(32,328) rotate(-4,146,134)" filter="url(#ed-panel-glow-blue)">
    <rect x="0" y="0" width="292" height="268" rx="14" fill="url(#ed-glass-fill)" stroke="url(#ed-glass-edge-blue)" stroke-width="1.6"/>
    <rect x="10" y="10" width="272" height="248" rx="11" fill="url(#ed-email-screen)"/>
    <circle cx="22" cy="22" r="2.5" fill="#ff6058" opacity="0.7"/>
    <circle cx="31" cy="22" r="2.5" fill="#ffbd2e" opacity="0.7"/>
    <circle cx="40" cy="22" r="2.5" fill="#28c840" opacity="0.7"/>

    <!-- exclusive badge -->
    <rect x="18" y="36" width="72" height="18" rx="9" fill="#ff2890" fill-opacity="0.75"/>
    <text x="54" y="48" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-family="system-ui,sans-serif" font-size="8" font-weight="700" letter-spacing="0.06em">EXCLUSIVE</text>
    <circle cx="248" cy="45" r="3" fill="#ffd050" fill-opacity="0.9"/>
    <path d="M248,38 L249,42 L253,42 L250,45 L251,49 L248,47 L245,49 L246,45 L243,42 L247,42 Z" fill="#ffd050" fill-opacity="0.85"/>

    <!-- offer hero -->
