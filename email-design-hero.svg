      <rect x="8" y="8" width="242" height="52" rx="6" fill="url(#ed-email-screen)"/>
      <text x="14" y="22" fill="#ffffff" fill-opacity="0.38" font-family="system-ui,sans-serif" font-size="7" font-weight="600" letter-spacing="0.05em">WELCOME SERIES</text>
      <rect x="14" y="28" width="44" height="28" rx="5" fill="url(#ed-campaign-b)" fill-opacity="0.55"/>
      <circle cx="36" cy="42" r="8" fill="#ffffff" fill-opacity="0.25"/>
      <path d="M32,42 L35,45 L40,39" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
      <rect x="66" y="30" width="110" height="5" rx="2.5" fill="#ffffff" opacity="0.42"/>
      <rect x="66" y="42" width="88" height="4" rx="2" fill="#ffffff" opacity="0.24"/>
      <rect x="66" y="52" width="72" height="12" rx="6" fill="#e82888" fill-opacity="0.4"/>
