      <rect x="0" y="0" width="298" height="76" rx="11" fill="url(#ed-glass-fill)" stroke="url(#ed-glass-edge-orange)" stroke-width="1.5"/>
      <rect x="8" y="8" width="282" height="60" rx="7" fill="url(#ed-email-screen)"/>
      <text x="14" y="22" fill="#ffffff" fill-opacity="0.4" font-family="system-ui,sans-serif" font-size="7" font-weight="600" letter-spacing="0.05em">SPRING SALE</text>
      <rect x="14" y="28" width="78" height="34" rx="5" fill="url(#ed-campaign-a)" fill-opacity="0.6"/>
      <text x="53" y="48" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="system-ui,sans-serif" font-size="11" font-weight="800">SALE</text>
      <rect x="100" y="30" width="118" height="5" rx="2.5" fill="#ffffff" opacity="0.5"/>
      <rect x="100" y="42" width="96" height="4" rx="2" fill="#ffffff" opacity="0.28"/>
      <rect x="100" y="52" width="68" height="14" rx="7" fill="url(#ed-cta)" fill-opacity="0.75"/>
      <text x="134" y="62" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-family="system-ui,sans-serif" font-size="7" font-weight="600">Shop Now</text>
      <rect x="228" y="30" width="54" height="32" rx="5" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="236" y="40" width="10" height="18" rx="2" fill="#2080ff" fill-opacity="0.5"/>
      <rect x="252" y="34" width="10" height="24" rx="2" fill="#e82888" fill-opacity="0.5"/>
      <rect x="268" y="44" width="10" height="14" rx="2" fill="#ff9020" fill-opacity="0.5"/>
    </g>
    <!-- campaign 5: product launch (lower front) -->
    <g transform="matrix(1,0,-0.025,0.97,1068,358)" filter="url(#ed-panel-glow-orange)">
      <rect x="0" y="0" width="278" height="72" rx="10" fill="url(#ed-glass-fill)" stroke="url(#ed-glass-edge-orange)" stroke-width="1.4"/>
      <rect x="8" y="8" width="262" height="56" rx="6" fill="url(#ed-email-screen)"/>
      <text x="14" y="22" fill="#ffffff" fill-opacity="0.38" font-family="system-ui,sans-serif" font-size="7" font-weight="600" letter-spacing="0.05em">PRODUCT LAUNCH</text>
      <rect x="14" y="28" width="108" height="32" rx="5" fill="url(#ed-hero-banner)" fill-opacity="0.55"/>
      <rect x="22" y="36" width="56" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
      <rect x="22" y="46" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.32"/>
      <rect x="130" y="30" width="120" height="5" rx="2.5" fill="#ffffff" opacity="0.42"/>
      <rect x="130" y="42" width="96" height="4" rx="2" fill="#ffffff" opacity="0.24"/>
      <rect x="130" y="52" width="80" height="14" rx="7" fill="#2080ff" fill-opacity="0.45"/>
      <text x="170" y="62" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="system-ui,sans-serif" font-size="7" font-weight="600">Pre-order</text>
