    <linearGradient id="ed-offer-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2890" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#e82888" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff9020" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ed-campaign-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2080ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#60b0ff" stop-opacity="0.35"/>
