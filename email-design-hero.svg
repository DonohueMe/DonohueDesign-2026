    <text x="146" y="98" text-anchor="middle" fill="#ffffff" fill-opacity="0.95" font-family="system-ui,sans-serif" font-size="36" font-weight="800" letter-spacing="-0.02em">30% OFF</text>
    <text x="146" y="118" text-anchor="middle" fill="#ffffff" fill-opacity="0.75" font-family="system-ui,sans-serif" font-size="10" font-weight="600">YOUR FIRST PROJECT</text>
    <rect x="88" y="128" width="116" height="18" rx="9" fill="#ffffff" fill-opacity="0.18"/>
    <text x="146" y="140" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-family="system-ui,sans-serif" font-size="8" font-weight="600">Ends in 48 hours</text>

    <!-- body copy -->
    <text x="18" y="178" fill="#ffffff" fill-opacity="0.62" font-family="system-ui,sans-serif" font-size="10" font-weight="600">You're invited — limited spots available</text>
    <rect x="18" y="188" width="220" height="4" rx="2" fill="#ffffff" opacity="0.28"/>
    <rect x="18" y="198" width="196" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="18" y="208" width="168" height="4" rx="2" fill="#ffffff" opacity="0.14"/>

    <!-- CTA -->
