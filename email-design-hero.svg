    <!-- campaign 4: win-back (back) -->
    <g transform="matrix(1,0,-0.05,0.94,1220,468)" opacity="0.42">
      <rect x="0" y="0" width="198" height="52" rx="9" fill="url(#ed-glass-fill)" stroke="url(#ed-glass-edge-neutral)" stroke-width="1.2"/>
      <text x="12" y="22" fill="#ffffff" fill-opacity="0.28" font-family="system-ui,sans-serif" font-size="7" font-weight="600" letter-spacing="0.05em">WIN-BACK</text>
      <rect x="12" y="28" width="88" height="4" rx="2" fill="#ffffff" opacity="0.18"/>
      <rect x="12" y="38" width="64" height="3" rx="1.5" fill="#ffffff" opacity="0.12"/>
    </g>
    <!-- campaign 3: newsletter -->
    <g transform="matrix(1,0,-0.04,0.95,1188,408)" opacity="0.58">
      <rect x="0" y="0" width="228" height="58" rx="9" fill="url(#ed-glass-fill)" stroke="url(#ed-glass-edge-neutral)" stroke-width="1.3"/>
      <rect x="8" y="8" width="212" height="42" rx="6" fill="url(#ed-email-screen)"/>
      <text x="14" y="22" fill="#ffffff" fill-opacity="0.35" font-family="system-ui,sans-serif" font-size="7" font-weight="600" letter-spacing="0.05em">NEWSLETTER</text>
