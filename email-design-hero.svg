    <linearGradient id="ed-campaign-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#901858" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4898" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ed-campaign-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c84808" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd050" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ed-cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7810"/>
      <stop offset="100%" stop-color="#ffb040"/>
    </linearGradient>
    <linearGradient id="ed-base-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2858c8"/>
      <stop offset="38%" stop-color="#c02888"/>
      <stop offset="72%" stop-color="#ff2890"/>
      <stop offset="100%" stop-color="#ff9020"/>
    </linearGradient>
    <linearGradient id="ed-floor-glow" x1="0" y1="720" x2="1440" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2080ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff2890" stop-opacity="0.12"/>
      <stop offset="72%" stop-color="#ff9018" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd050" stop-opacity="0"/>
    </linearGradient>
    <filter id="ed-aurora-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="ed-wave-blur" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="ed-panel-glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="0" stdDeviation="12" flood-color="#4090ff" flood-opacity="0.35"/>
    </filter>
    <filter id="ed-panel-glow-orange" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="4" dy="0" stdDeviation="14" flood-color="#ff9020" flood-opacity="0.32"/>
    </filter>
