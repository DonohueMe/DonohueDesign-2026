<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="ed-wave-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0038a8"/>
      <stop offset="100%" stop-color="#0078ff"/>
    </linearGradient>
    <linearGradient id="ed-wave-blue-bright" x1="0%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#0050dd"/>
      <stop offset="100%" stop-color="#20a0ff"/>
    </linearGradient>
    <linearGradient id="ed-wave-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#901858"/>
      <stop offset="50%" stop-color="#d02090"/>
      <stop offset="100%" stop-color="#ff2890"/>
    </linearGradient>
    <linearGradient id="ed-wave-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c84808"/>
      <stop offset="100%" stop-color="#ff9018"/>
    </linearGradient>
    <linearGradient id="ed-wave-orange-bright" x1="55%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7810"/>
      <stop offset="100%" stop-color="#ffd050"/>
    </linearGradient>
    <radialGradient id="ed-spot-blue" cx="22%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#40a0ff" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#0848e8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0038a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ed-spot-orange" cx="84%" cy="44%" r="40%">
      <stop offset="0%" stop-color="#ffb040" stop-opacity="0.98"/>
      <stop offset="42%" stop-color="#ff7810" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#ff6010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ed-spot-magenta" cx="52%" cy="46%" r="34%">
      <stop offset="0%" stop-color="#ff4898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e82888" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ed-glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="ed-glass-edge-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90c8ff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ed-glass-edge-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ed-glass-edge-orange" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb860" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ed-email-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="ed-hero-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2080ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e82888" stop-opacity="0.45"/>
