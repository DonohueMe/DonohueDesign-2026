<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="bfp-glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="bfp-glass-edge-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90c8ff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="bfp-glass-edge-orange" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb860" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bfp-panel-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bfp-photo-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3090ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60c8ff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bfp-photo-b" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e82888" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9020" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bfp-bar-a" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2080ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#60b0ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bfp-bar-b" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e82888" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff60a8" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bfp-panel-glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-3" dy="0" stdDeviation="10" flood-color="#4090ff" flood-opacity="0.3"/>
    </filter>
    <filter id="bfp-panel-glow-orange" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="3" dy="0" stdDeviation="12" flood-color="#ff9020" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- LEFT — tri-fold brochure -->
  <g transform="translate(28, 248) rotate(-9)" filter="url(#bfp-panel-glow-blue)" opacity="0.72">
    <rect x="0" y="0" width="222" height="308" rx="10" fill="url(#bfp-glass-fill)" stroke="url(#bfp-glass-edge-blue)" stroke-width="1.4"/>
    <rect x="6" y="6" width="210" height="296" rx="8" fill="url(#bfp-panel-screen)"/>
    <!-- fold creases -->
    <line x1="76" y1="10" x2="76" y2="298" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="152" y1="10" x2="152" y2="298" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 4"/>
    <!-- panel 1 — cover -->
    <rect x="14" y="22" width="54" height="54" rx="4" fill="url(#bfp-photo-a)"/>
    <rect x="14" y="84" width="50" height="5" rx="2.5" fill="#ffffff" opacity="0.48"/>
    <rect x="14" y="96" width="42" height="3" rx="1.5" fill="#ffffff" opacity="0.28"/>
    <rect x="14" y="106" width="46" height="3" rx="1.5" fill="#ffffff" opacity="0.2"/>
    <rect x="14" y="268" width="54" height="18" rx="3" fill="#2080ff" fill-opacity="0.35"/>
    <!-- panel 2 — inside spread -->
    <rect x="84" y="22" width="60" height="5" rx="2.5" fill="#ffffff" opacity="0.42"/>
    <circle cx="88" cy="40" r="2" fill="#ffffff" opacity="0.35"/>
    <rect x="94" y="38" width="48" height="3" rx="1.5" fill="#ffffff" opacity="0.26"/>
    <circle cx="88" cy="52" r="2" fill="#ffffff" opacity="0.35"/>
    <rect x="94" y="50" width="44" height="3" rx="1.5" fill="#ffffff" opacity="0.22"/>
    <circle cx="88" cy="64" r="2" fill="#ffffff" opacity="0.35"/>
    <rect x="94" y="62" width="50" height="3" rx="1.5" fill="#ffffff" opacity="0.18"/>
    <rect x="84" y="82" width="58" height="44" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="90" y="134" width="10" height="28" rx="2" fill="url(#bfp-bar-a)"/>
    <rect x="104" y="126" width="10" height="36" rx="2" fill="url(#bfp-bar-b)"/>
    <rect x="118" y="140" width="10" height="22" rx="2" fill="url(#bfp-bar-a)"/>
    <!-- panel 3 — back -->
    <circle cx="186" cy="52" r="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="186" cy="52" r="10" fill="#ff9020" fill-opacity="0.35"/>
    <rect x="162" y="84" width="46" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
    <rect x="162" y="94" width="38" height="3" rx="1.5" fill="#ffffff" opacity="0.2"/>
    <rect x="162" y="104" width="42" height="3" rx="1.5" fill="#ffffff" opacity="0.16"/>
    <rect x="162" y="268" width="46" height="4" rx="2" fill="#ffffff" opacity="0.22"/>
    <rect x="162" y="278" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.14"/>
  </g>

  <!-- LEFT — single-sheet flyer -->
  <g transform="translate(72, 520) rotate(7)" opacity="0.58">
    <rect x="0" y="0" width="148" height="210" rx="9" fill="url(#bfp-glass-fill)" stroke="url(#bfp-glass-edge-blue)" stroke-width="1.2"/>
    <rect x="6" y="6" width="136" height="198" rx="7" fill="url(#bfp-panel-screen)"/>
    <rect x="14" y="16" width="120" height="72" rx="5" fill="url(#bfp-photo-b)"/>
    <rect x="14" y="98" width="88" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
    <rect x="14" y="112" width="72" height="3" rx="1.5" fill="#ffffff" opacity="0.28"/>
    <rect x="14" y="122" width="80" height="3" rx="1.5" fill="#ffffff" opacity="0.22"/>
    <circle cx="18" cy="138" r="2" fill="#ffffff" opacity="0.35"/>
    <rect x="24" y="136" width="64" height="3" rx="1.5" fill="#ffffff" opacity="0.2"/>
    <circle cx="18" cy="150" r="2" fill="#ffffff" opacity="0.35"/>
    <rect x="24" y="148" width="56" height="3" rx="1.5" fill="#ffffff" opacity="0.18"/>
    <circle cx="18" cy="162" r="2" fill="#ffffff" opacity="0.35"/>
    <rect x="24" y="160" width="60" height="3" rx="1.5" fill="#ffffff" opacity="0.16"/>
    <rect x="14" y="178" width="120" height="18" rx="4" fill="#2080ff" fill-opacity="0.32"/>
    <rect x="22" y="184" width="48" height="4" rx="2" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- RIGHT — bi-fold brochure (open booklet) -->
  <g transform="translate(1158, 232) rotate(8)" filter="url(#bfp-panel-glow-orange)" opacity="0.7">
    <rect x="0" y="0" width="248" height="292" rx="10" fill="url(#bfp-glass-fill)" stroke="url(#bfp-glass-edge-orange)" stroke-width="1.4"/>
    <rect x="6" y="6" width="236" height="280" rx="8" fill="url(#bfp-panel-screen)"/>
    <!-- center fold -->
    <line x1="124" y1="10" x2="124" y2="282" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="4 5"/>
    <!-- left spread -->
    <rect x="16" y="20" width="98" height="62" rx="5" fill="url(#bfp-photo-b)"/>
    <rect x="16" y="92" width="72" height="5" rx="2.5" fill="#ffffff" opacity="0.46"/>
    <rect x="16" y="104" width="58" height="3" rx="1.5" fill="#ffffff" opacity="0.26"/>
    <rect x="16" y="114" width="64" height="3" rx="1.5" fill="#ffffff" opacity="0.2"/>
    <circle cx="20" cy="130" r="2" fill="#ffffff" opacity="0.32"/>
    <rect x="26" y="128" width="52" height="3" rx="1.5" fill="#ffffff" opacity="0.18"/>
    <circle cx="20" cy="142" r="2" fill="#ffffff" opacity="0.32"/>
    <rect x="26" y="140" width="48" height="3" rx="1.5" fill="#ffffff" opacity="0.16"/>
    <rect x="16" y="248" width="98" height="22" rx="4" fill="#ff9020" fill-opacity="0.3"/>
    <!-- right spread -->
    <rect x="134" y="20" width="98" height="5" rx="2.5" fill="#ffffff" opacity="0.42"/>
    <rect x="134" y="32" width="80" height="3" rx="1.5" fill="#ffffff" opacity="0.24"/>
    <rect x="134" y="48" width="88" height="88" rx="5" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="178" cy="78" r="22" fill="#ff9020" fill-opacity="0.28"/>
    <path d="M168,78 L178,66 L188,78 L178,96 Z" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="134" y="148" width="10" height="32" rx="2" fill="url(#bfp-bar-b)"/>
    <rect x="150" y="140" width="10" height="40" rx="2" fill="url(#bfp-bar-a)"/>
    <rect x="166" y="152" width="10" height="28" rx="2" fill="url(#bfp-bar-b)"/>
    <rect x="182" y="144" width="10" height="36" rx="2" fill="url(#bfp-bar-a)"/>
    <rect x="134" y="248" width="98" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="134" y="258" width="72" height="3" rx="1.5" fill="#ffffff" opacity="0.14"/>
  </g>

  <!-- RIGHT — rack flyer -->
  <g transform="translate(1210, 538) rotate(-6)" opacity="0.55">
    <rect x="0" y="0" width="156" height="198" rx="9" fill="url(#bfp-glass-fill)" stroke="url(#bfp-glass-edge-orange)" stroke-width="1.2"/>
    <rect x="6" y="6" width="144" height="186" rx="7" fill="url(#bfp-panel-screen)"/>
    <!-- flyer header band -->
    <rect x="14" y="14" width="128" height="28" rx="4" fill="#ff9020" fill-opacity="0.28"/>
    <rect x="22" y="24" width="72" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="14" y="52" width="128" height="58" rx="4" fill="url(#bfp-photo-a)"/>
    <rect x="14" y="118" width="96" height="5" rx="2.5" fill="#ffffff" opacity="0.44"/>
    <rect x="14" y="130" width="80" height="3" rx="1.5" fill="#ffffff" opacity="0.26"/>
    <rect x="14" y="140" width="88" height="3" rx="1.5" fill="#ffffff" opacity="0.2"/>
    <rect x="14" y="152" width="60" height="3" rx="1.5" fill="#ffffff" opacity="0.16"/>
    <rect x="14" y="168" width="128" height="1" fill="#ffffff" opacity="0.12"/>
    <rect x="14" y="176" width="56" height="14" rx="3" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15"/>
    <rect x="86" y="176" width="56" height="14" rx="3" fill="#e82888" fill-opacity="0.28"/>
  </g>
</svg>
