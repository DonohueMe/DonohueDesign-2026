<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="pd-wave-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0038a8"/>
      <stop offset="100%" stop-color="#0078ff"/>
    </linearGradient>
    <linearGradient id="pd-wave-blue-bright" x1="0%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#0050dd"/>
      <stop offset="100%" stop-color="#20a0ff"/>
    </linearGradient>
    <linearGradient id="pd-wave-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#901858"/>
      <stop offset="50%" stop-color="#d02090"/>
      <stop offset="100%" stop-color="#ff2890"/>
    </linearGradient>
    <linearGradient id="pd-wave-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c84808"/>
      <stop offset="100%" stop-color="#ff9018"/>
    </linearGradient>
    <linearGradient id="pd-wave-orange-bright" x1="55%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7810"/>
      <stop offset="100%" stop-color="#ffd050"/>
    </linearGradient>
    <radialGradient id="pd-spot-blue" cx="22%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#40a0ff" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#0848e8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0038a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pd-spot-orange" cx="84%" cy="44%" r="40%">
      <stop offset="0%" stop-color="#ffb040" stop-opacity="0.98"/>
      <stop offset="42%" stop-color="#ff7810" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#ff6010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pd-spot-magenta" cx="52%" cy="46%" r="34%">
      <stop offset="0%" stop-color="#ff4898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e82888" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pd-slide-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="pd-slide-edge-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90c8ff" stop-opacity="0.88"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="pd-slide-edge-neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pd-slide-edge-orange" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb860" stop-opacity="0.78"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pd-slide-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pd-bar-a" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2080ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#60b0ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pd-bar-b" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e82888" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff60a8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pd-base-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2858c8"/>
      <stop offset="38%" stop-color="#c02888"/>
      <stop offset="72%" stop-color="#ff2890"/>
      <stop offset="100%" stop-color="#ff9020"/>
    </linearGradient>
    <linearGradient id="pd-floor-glow" x1="0" y1="720" x2="1440" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2080ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff2890" stop-opacity="0.12"/>
      <stop offset="72%" stop-color="#ff9018" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd050" stop-opacity="0"/>
    </linearGradient>
    <filter id="pd-aurora-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="pd-wave-blur" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="pd-slide-glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-3" dy="0" stdDeviation="10" flood-color="#4090ff" flood-opacity="0.32"/>
    </filter>
    <filter id="pd-slide-glow-orange" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="3" dy="0" stdDeviation="10" flood-color="#ff9020" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#pd-base-sky)"/>
  <rect width="1440" height="900" fill="url(#pd-spot-blue)"/>
  <rect width="1440" height="900" fill="url(#pd-spot-magenta)"/>
  <rect width="1440" height="900" fill="url(#pd-spot-orange)"/>

  <g filter="url(#pd-aurora-blur)">
    <ellipse cx="280" cy="420" rx="340" ry="260" fill="#2080ff" opacity="0.62"/>
    <ellipse cx="720" cy="400" rx="380" ry="240" fill="#e82888" opacity="0.52"/>
    <ellipse cx="1180" cy="390" rx="360" ry="280" fill="#ff9020" opacity="0.68"/>
    <ellipse cx="980" cy="430" rx="280" ry="200" fill="#ffd050" opacity="0.42"/>
  </g>

  <g filter="url(#pd-wave-blur)">
    <path d="M0,360 C220,180 480,520 720,280 C960,40 1200,420 1440,220 L1440,900 L0,900 Z" fill="url(#pd-wave-blue)" opacity="0.58"/>
    <path d="M0,420 C180,260 460,560 700,340 C940,120 1180,480 1440,300 L1440,900 L0,900 Z" fill="url(#pd-wave-blue-bright)" opacity="0.72"/>
    <path d="M0,470 C260,300 540,600 820,380 C1100,160 1320,520 1440,360 L1440,900 L0,900 Z" fill="url(#pd-wave-magenta)" opacity="0.78"/>
    <path d="M0,520 C240,380 520,640 800,420 C1080,200 1300,560 1440,420 L1440,900 L0,900 Z" fill="#e02888" opacity="0.62"/>
    <path d="M0,570 C280,430 580,680 880,460 C1180,240 1360,580 1440,480 L1440,900 L0,900 Z" fill="url(#pd-wave-orange)" opacity="0.82"/>
    <path d="M0,620 C320,480 620,720 920,500 C1220,280 1380,620 1440,540 L1440,900 L0,900 Z" fill="url(#pd-wave-orange-bright)" opacity="0.88"/>
  </g>

  <rect y="700" width="1440" height="200" fill="url(#pd-floor-glow)" opacity="0.85"/>

  <!-- left deck: fan downward -->
  <g transform="translate(0, 65)">
    <g transform="translate(244, 364) scale(0.75, 2.5) translate(-244, -364)">
    <g transform="matrix(1,0,-0.05,0.88,42,398)" opacity="0.5">
      <rect x="0" y="0" width="248" height="140" rx="10" fill="url(#pd-slide-fill)" stroke="url(#pd-slide-edge-neutral)" stroke-width="1.3"/>
    </g>
    <g transform="matrix(1,0,-0.04,0.91,58,358)" opacity="0.65">
      <rect x="0" y="0" width="268" height="151" rx="10" fill="url(#pd-slide-fill)" stroke="url(#pd-slide-edge-neutral)" stroke-width="1.4"/>
    </g>
    <g transform="matrix(1,0,-0.03,0.94,74,318)" opacity="0.78">
      <rect x="0" y="0" width="288" height="162" rx="10" fill="url(#pd-slide-fill)" stroke="url(#pd-slide-edge-neutral)" stroke-width="1.4"/>
    </g>
    <g transform="matrix(1,0,-0.02,0.96,90,278)" filter="url(#pd-slide-glow-blue)">
      <rect x="0" y="0" width="308" height="173" rx="11" fill="url(#pd-slide-fill)" stroke="url(#pd-slide-edge-blue)" stroke-width="1.6"/>
      <rect x="10" y="10" width="288" height="153" rx="8" fill="url(#pd-slide-screen)"/>
      <!-- slide chrome -->
      <circle cx="22" cy="22" r="3" fill="#ff6058" opacity="0.75"/>
      <circle cx="32" cy="22" r="3" fill="#ffbd2e" opacity="0.75"/>
      <circle cx="42" cy="22" r="3" fill="#28c840" opacity="0.75"/>
      <!-- title -->
      <rect x="24" y="38" width="168" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
      <!-- bullets -->
      <circle cx="28" cy="62" r="3" fill="#ffffff" opacity="0.35"/>
      <rect x="38" y="59" width="120" height="5" rx="2.5" fill="#ffffff" opacity="0.32"/>
      <circle cx="28" cy="78" r="3" fill="#ffffff" opacity="0.35"/>
      <rect x="38" y="75" width="104" height="5" rx="2.5" fill="#ffffff" opacity="0.28"/>
      <circle cx="28" cy="94" r="3" fill="#ffffff" opacity="0.35"/>
      <rect x="38" y="91" width="112" height="5" rx="2.5" fill="#ffffff" opacity="0.24"/>
      <!-- mini chart -->
      <rect x="210" y="52" width="72" height="96" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="222" y="108" width="12" height="28" rx="2" fill="url(#pd-bar-a)"/>
      <rect x="240" y="88" width="12" height="48" rx="2" fill="url(#pd-bar-b)"/>
      <rect x="258" y="72" width="12" height="64" rx="2" fill="url(#pd-bar-a)"/>
      <!-- slide number -->
      <text x="278" y="162" text-anchor="end" fill="#ffffff" fill-opacity="0.28" font-family="system-ui,sans-serif" font-size="11" font-weight="500">3</text>
    </g>
    </g>
  </g>

  <!-- right deck: fan downward (mirrored) -->
  <g transform="translate(0, 65)">
    <g transform="translate(1196, 364) scale(0.75, 2.5) translate(-1196, -364)">
    <g transform="matrix(1,0,0.05,0.88,1150,398)" opacity="0.5" filter="url(#pd-slide-glow-orange)">
      <rect x="0" y="0" width="248" height="140" rx="10" fill="url(#pd-slide-fill)" stroke="url(#pd-slide-edge-orange)" stroke-width="1.3" opacity="0.52"/>
    </g>
    <g transform="matrix(1,0,0.04,0.91,1112,358)" opacity="0.65">
      <rect x="0" y="0" width="268" height="151" rx="10" fill="url(#pd-slide-fill)" stroke="url(#pd-slide-edge-neutral)" stroke-width="1.4"/>
    </g>
    <g transform="matrix(1,0,0.03,0.94,1074,318)" opacity="0.78">
      <rect x="0" y="0" width="288" height="162" rx="10" fill="url(#pd-slide-fill)" stroke="url(#pd-slide-edge-neutral)" stroke-width="1.4"/>
    </g>
    <g transform="matrix(1,0,0.02,0.96,1042,278)" filter="url(#pd-slide-glow-orange)">
      <rect x="0" y="0" width="308" height="173" rx="11" fill="url(#pd-slide-fill)" stroke="url(#pd-slide-edge-orange)" stroke-width="1.6"/>
      <rect x="10" y="10" width="288" height="153" rx="8" fill="url(#pd-slide-screen)"/>
      <circle cx="22" cy="22" r="3" fill="#ff6058" opacity="0.75"/>
      <circle cx="32" cy="22" r="3" fill="#ffbd2e" opacity="0.75"/>
      <circle cx="42" cy="22" r="3" fill="#28c840" opacity="0.75"/>
      <!-- image placeholder + headline layout -->
      <rect x="24" y="38" width="118" height="88" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="32" y="48" width="48" height="48" rx="24" fill="#ff9020" fill-opacity="0.35"/>
      <rect x="152" y="38" width="130" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
      <rect x="152" y="54" width="108" height="5" rx="2.5" fill="#ffffff" opacity="0.3"/>
      <rect x="152" y="68" width="116" height="5" rx="2.5" fill="#ffffff" opacity="0.24"/>
      <rect x="152" y="82" width="96" height="5" rx="2.5" fill="#ffffff" opacity="0.2"/>
      <!-- progress bar -->
      <rect x="24" y="138" width="260" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="24" y="138" width="168" height="6" rx="3" fill="#ff9020" fill-opacity="0.55"/>
      <text x="278" y="162" text-anchor="end" fill="#ffffff" fill-opacity="0.28" font-family="system-ui,sans-serif" font-size="11" font-weight="500">7</text>
    </g>
    </g>
  </g>
</svg>
